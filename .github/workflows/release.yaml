---
# Release workflow for aapi-codegen, modelled on plheide/go-jsonschema's
# release.yaml.
#
# Tool versions (GO_VERSION, ...) live in .github/versions.env and are
# loaded into $GITHUB_ENV by the "Load versions" step below. Same file is
# loaded by development.yaml, guaranteeing CI and release build with
# identical tool versions.

name: release
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }} @ ${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - name: Load versions
        # $GITHUB_ENV's format is strict KEY=VALUE only — comments and
        # blank lines from versions.env would fail with "Invalid format".
        # Filter to lines that look like environment-variable
        # assignments before appending.
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .github/versions.env >> "$GITHUB_ENV"
      - name: Fetch all tags
        run: git fetch --force --tags
      - name: Setup Golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      # Sanity: smoke the build before goreleaser runs. Fast feedback if
      # the Go version or a dependency drifted. `tidy -diff` fails instead
      # of rewriting go.mod / go.sum: a rewrite here would leave the tree
      # dirty and make goreleaser abort after the tag was already pushed.
      - name: Pre-flight build
        run: |
          go mod tidy -diff
          go build ./...
          go test ./...
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: 2.15.4
          args: release --verbose --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

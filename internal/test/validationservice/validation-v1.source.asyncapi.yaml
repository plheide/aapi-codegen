asyncapi: 3.1.0
info:
  title: ValidationDemo
  version: 1.0.0
  description: |
    Synthetic fixture for the Validation knob (Option B). The same
    PingMessage spec is generated with validation on (default), opt-out
    via CLI/config, and opt-out via the x-aapi-codegen.omit-validation
    spec extension — the acceptance test asserts the right
    UnmarshalJSON behaviour (or absence) in each.

defaultContentType: application/json

channels:
  pingChannel:
    address: ping
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: Validation
          type: direct
        bindingVersion: 0.3.0
    messages:
      PingMessage:
        payload:
          type: object
          required: [id, msg]
          additionalProperties: false
          properties:
            id:  { type: string }
            msg: { type: string }
            kind: { type: string, enum: [ping, echo] }
            replyTo: { type: string }
            correlationID: { type: string }
            retryOf: { type: string }
            attempt: { type: integer }
            ttlSeconds: { type: integer }
            expiresAt: { type: string }
          # An echo needs an address to reply to,
          allOf:
            - if: { properties: { kind: { const: echo } }, required: [kind] }
              then: { required: [replyTo] }
          # a reply address needs a correlation ID,
          dependentRequired:
            replyTo: [correlationID]
          # and a retry needs its attempt number, in draft-07's spelling.
          dependencies:
            retryOf: [attempt]
          # An expiry is relative or absolute, not both.
          not: { required: [ttlSeconds, expiresAt] }

operations:
  sendPing:
    action: send
    channel: { $ref: '#/channels/pingChannel' }
    messages:
      - $ref: '#/channels/pingChannel/messages/PingMessage'
